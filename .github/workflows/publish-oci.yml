name: Publish OCI Module

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-oci:
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write

    runs-on: ubuntu-latest

    outputs:
      registry: ${{ steps.release-details.outputs.registry }}
      digest: ${{ steps.get-digest.outputs.digest }}
      image: ${{ steps.release-details.outputs.image }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release details
        id: release-details
        run: |
          REGISTRY=ghcr.io
          NAMESPACE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")
          VERSION=${{ github.event.release.tag_name }}
          PACKAGE_NAME=terraform-aws-static-site-s3-https
          IMAGE=$REGISTRY/$NAMESPACE/$REPO_NAME

          echo "Registry: $REGISTRY"
          echo "Namespace: $NAMESPACE"
          echo "Repository name: $REPO_NAME"
          echo "Version: $VERSION"
          echo "Package name: $PACKAGE_NAME"
          echo "Image: $IMAGE"

          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT
          echo "release_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Generate Terraform module package
        run: |
          tar -czf ${{ steps.release-details.outputs.package_name }}.tar.gz \
            *.tf modules/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ steps.release-details.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Oras
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      - name: Push Terraform module to GHCR
        run: |
          oras version
          oras push ${{ steps.release-details.outputs.image }}:${{ steps.release-details.outputs.release_version }} \
            --artifact-type application/vnd.terraform.module \
            --annotation "org.opencontainers.image.title=Terraform AWS Static Site S3 HTTPS Module" \
            --annotation "org.opencontainers.image.description=Provision AWS static site (S3, CloudFront, Route53) with Terraform" \
            --annotation "org.opencontainers.image.authors=Robert Young <me@iamrobertyoung.co.uk>" \
            --annotation "org.opencontainers.image.version=${{ steps.release-details.outputs.release_version }}" \
            --annotation "org.opencontainers.image.ref.name=${{ steps.release-details.outputs.release_name }}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.documentation=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.issue-tracker=https://github.com/${{ github.repository }}/issues" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            ${{ steps.release-details.outputs.package_name }}.tar.gz

      - name: Setup Crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Get pushed module digest
        id: get-digest
        run: |
          digest=$(crane digest ${{ steps.release-details.outputs.image }}:${{ steps.release-details.outputs.release_version }})
          echo digest=$digest >> "$GITHUB_OUTPUT"
          echo $digest

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Use Cosign
        run: |
          artifact_digest_uri="${{ steps.release-details.outputs.image }}@${{ steps.get-digest.outputs.digest }}"
          cosign sign --yes "${artifact_digest_uri}"
          cosign verify "${artifact_digest_uri}" \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo cosign verify "${artifact_digest_uri}" \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Generate SBOM
        id: checkov
        uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # master
        with:
          output_format: cyclonedx_json
          output_file_path: results_cyclonedx.json,
          quiet: false
          soft_fail: false
          config_file: .checkov.yml

      - name: Attest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release-details.outputs.image }}
          subject-digest: ${{ steps.get-digest.outputs.digest }}
          push-to-registry: true

      - name: Extract in-toto attestation from Sigstore bundle
        run: |
          # Extract the DSSE payload from the Sigstore bundle and decode it
          jq -r '.dsseEnvelope.payload' ${{ steps.attest.outputs.bundle-path }} | base64 -d > ${{ steps.release-details.outputs.package_name }}.intoto.jsonl

          # Verify the extracted file is valid JSON
          jq . ${{ steps.release-details.outputs.package_name }}.intoto.jsonl

          # Keep the original bundle file too for completeness
          cp ${{ steps.attest.outputs.bundle-path }} ${{ steps.release-details.outputs.package_name }}.sigstore.json

      - name: Rename SBOM to standard filename
        run: |
          mv ./results_cyclonedx.json ${{ steps.release-details.outputs.package_name }}.cdx.json

      - name: Attach SBOM and provenance to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v2
        with:
          tag_name: ${{ steps.release-details.outputs.release_version }}
          files: |
            ./${{ steps.release-details.outputs.package_name }}.cdx.json
            ./${{ steps.release-details.outputs.package_name }}.intoto.jsonl
            ./${{ steps.release-details.outputs.package_name }}.sigstore.json

  terraform-provenance:
    needs:
      - publish-oci
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      digest: "${{ needs.publish-oci.outputs.digest }}"
      image: "${{ needs.publish-oci.outputs.image }}"
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verification-with-cosign:
    needs:
      - publish-oci
      - terraform-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ needs.publish-oci.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Verify image
        env:
          IMAGE: "${{ needs.publish-oci.outputs.image }}"
          DIGEST: ${{ needs.publish-oci.outputs.digest }}
        # slsa-github-generator writes a legacy .att attestation, but Cosign v3 reads only OCI referrer bundles when any exist, and attest-build-provenance always pushes one.
        run: |
          cosign verify-attestation \
              --new-bundle-format=false \
              --type slsaprovenance \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v[0-9]+.[0-9]+.[0-9]+$' \
              $IMAGE@$DIGEST
